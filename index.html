<div id="file-list-container">
    <p>ファイルを取得中...</p>
</div>

<script>
    // 1. あなたの情報を設定してください
    const username = 'あなたのユーザー名';
    const repo = 'リポジトリ名';
    const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/`;

    async function fetchFiles() {
        try {
            const response = await fetch(apiUrl);
            const files = await response.json();

            const container = document.getElementById('file-list-container');
            container.innerHTML = ''; // ローディング表示を消す

            const ul = document.createElement('ul');

            files.forEach(file => {
                // HTMLファイルだけを抽出（index.htmlは除外する場合の条件付き）
                if (file.name.endsWith('.html') && file.name !== 'index.html') {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    
                    // ファイル名からリンクを作成
                    a.href = file.name; 
                    a.textContent = file.name; // ファイル名をそのまま表示名にする
                    
                    li.appendChild(a);
                    ul.appendChild(li);
                }
            });

            container.appendChild(ul);
        } catch (error) {
            console.error('データの取得に失敗しました:', error);
            document.getElementById('file-list-container').innerText = '読み込みに失敗しました。';
        }
    }

    fetchFiles();
</script>
