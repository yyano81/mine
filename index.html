<div id="file-list-container">
    <p>ファイルを読み込んでいます...</p>
</div>

<script>
    // 設定を固定しました
    const username = 'yyano81';
    const repo = 'mine';
    // APIのURL（?t=...を付けて最新情報を強制取得するようにしました）
    const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/?t=${new Date().getTime()}`;

    async function fetchFiles() {
        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error('Network response was not ok');
            const files = await response.json();

            const container = document.getElementById('file-list-container');
            container.innerHTML = ''; 

            const ul = document.createElement('ul');

            files.forEach(file => {
                // .html で終わるファイルのみ（index.html は除く）
                if (file.name.endsWith('.html') && file.name !== 'index.html') {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    
                    // リンク先を現在のリポジトリのパスに合わせる
                    // ./ファイル名 とすることで、mineリポジトリ内を正しく参照します
                    a.href = `./${file.name}`;
                    
                    // 表示名は .html を取って読みやすく
                    a.textContent = file.name.replace('.html', ''); 
                    
                    li.appendChild(a);
                    ul.appendChild(li);
                }
            });

            if (ul.childElementCount === 0) {
                container.innerText = '表示できるHTMLファイルが見つかりませんでした。';
            } else {
                container.appendChild(ul);
            }

        } catch (error) {
            console.error('エラー内容:', error);
            document.getElementById('file-list-container').innerText = '読み込みに失敗しました。リポジトリがPublic（公開）になっているか確認してください。';
        }
    }

    fetchFiles();
</script>
