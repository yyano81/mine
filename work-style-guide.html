<section id="career-finance-simulator" style="max-width: 800px; margin: 20px auto; padding: 25px; border: none; border-radius: 16px; background: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif; box-shadow: 0 10px 25px rgba(0,0,0,0.1); color: #333;">
    <h2 style="text-align: center; color: #1a73e8; margin-bottom: 10px;">📊 月収・働き方シミュレーター</h2>
    <p style="text-align: center; font-size: 0.9em; color: #666; margin-bottom: 30px;">「手取り額」と「時間の自由」を、今の自分に合わせてシミュレーション</p>

    <div style="background: #f1f3f4; padding: 20px; border-radius: 12px; margin-bottom: 25px;">
        <!-- 入力：現状の形態 -->
        <div style="margin-bottom: 20px;">
            <label style="display: block; font-weight: bold; margin-bottom: 8px;">1. 現在の契約形態は？</label>
            <div style="display: flex; gap: 10px;">
                <label style="flex: 1; background: white; padding: 10px; border-radius: 8px; border: 1px solid #ccc; text-align: center; cursor: pointer;">
                    <input type="radio" name="currentStatus" value="freelance" checked> フリーランス
                </label>
                <label style="flex: 1; background: white; padding: 10px; border-radius: 8px; border: 1px solid #ccc; text-align: center; cursor: pointer;">
                    <input type="radio" name="currentStatus" value="employee"> 正社員
                </label>
            </div>
        </div>

        <!-- 入力：月額単価 -->
        <div style="margin-bottom: 20px;">
            <label style="display: block; font-weight: bold; margin-bottom: 8px;">2. 毎月の収入（売上・額面）は？</label>
            <div style="display: flex; align-items: center; background: white; border: 1px solid #ccc; border-radius: 8px; padding: 0 10px;">
                <input type="number" id="monthlyIncome" placeholder="例: 600000" style="width: 100%; border: none; padding: 12px; outline: none; font-size: 1.1em;">
                <span style="font-weight: bold; color: #666;">円</span>
            </div>
        </div>

        <!-- 入力：月額経費 -->
        <div style="margin-bottom: 20px;">
            <label style="display: block; font-weight: bold; margin-bottom: 8px;">3. 毎月の平均経費は？</label>
            <div style="display: flex; align-items: center; background: white; border: 1px solid #ccc; border-radius: 8px; padding: 0 10px;">
                <input type="number" id="monthlyExpense" placeholder="例: 30000" value="0" style="width: 100%; border: none; padding: 12px; outline: none; font-size: 1.1em;">
                <span style="font-weight: bold; color: #666;">円</span>
            </div>
            <small style="color: #888;">※フリーランスの場合のPC代、通信費、交通費など</small>
        </div>

        <button onclick="runSimulation()" style="width: 100%; padding: 15px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1em; transition: background 0.3s;">診断結果を表示する</button>
    </div>

    <!-- 結果表示エリア -->
    <div id="result-area" style="display: none; animation: fadeIn 0.5s;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
            <div style="background: #fff4e5; padding: 15px; border-radius: 12px; border-top: 4px solid #e67e22;">
                <p style="margin: 0; font-size: 0.85em; color: #e67e22; font-weight: bold;">フリーランス手取り</p>
                <p id="f-result" style="font-size: 1.4em; font-weight: bold; margin: 10px 0 0 0;">-- 円</p>
            </div>
            <div style="background: #e8f0fe; padding: 15px; border-radius: 12px; border-top: 4px solid #1a73e8;">
                <p style="margin: 0; font-size: 0.85em; color: #1a73e8; font-weight: bold;">正社員（自社）手取り</p>
                <p id="s-result" style="font-size: 1.4em; font-weight: bold; margin: 10px 0 0 0;">-- 円</p>
            </div>
        </div>

        <div id="message-box" style="padding: 15px; border-radius: 12px; background: #f8f9fa; border: 1px solid #e1e4e8; line-height: 1.6;">
            <!-- メッセージが動的に入ります -->
        </div>
    </div>
</section>

<style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    input[type="radio"] { transform: scale(1.2); margin-right: 5px; }
</style>

<script>
function runSimulation() {
    const monthlyIncome = Number(document.getElementById('monthlyIncome').value);
    const monthlyExpense = Number(document.getElementById('monthlyExpense').value);

    if (!monthlyIncome) {
        alert("毎月の収入を入力してください");
        return;
    }

    // --- 計算ロジック ---
    // 正社員：社会保険料・所得税・住民税でおよそ月収の20〜25%が引かれる想定
    // ただし会社負担の社会保険料（福利厚生）があるため、実質手取り率は高め
    const sTakeHome = Math.floor(monthlyIncome * 0.78);

    // フリーランス：売上から経費を弾き、さらに国保・国民年金・所得税・住民税（約25%〜30%）を引く
    const fTaxBasis = monthlyIncome - monthlyExpense;
    const fTakeHome = Math.floor(fTaxBasis * 0.72); // 自分で全て払うため正社員より税負担率が高めに出やすい

    // 結果の表示
    document.getElementById('result-area').style.display = 'block';
    document.getElementById('f-result').innerText = fTakeHome.toLocaleString() + " 円";
    document.getElementById('s-result').innerText = sTakeHome.toLocaleString() + " 円";

    const msgBox = document.getElementById('message-box');
    let msg = "";

    if (monthlyIncome >= 600000) {
        msg = `
            <h4 style="color: #2e7d32; margin-top: 0;">✨ あなたは「セルフ管理型」対象者です</h4>
            <p style="font-size: 0.9em;">月収60万（年収720万相当）以上の方は、当社の<b>「セルフ管理型勤務体系」</b>を選択可能です。
            手取り額の差以上に、<b>「中抜け・早退の給与控除なし」</b>という自由度が、あなたのQOL（生活の質）を劇的に向上させます。</p>
        `;
    } else {
        msg = `
            <h4 style="color: #1a73e8; margin-top: 0;">🤝 安定と自由を両立するチャンス</h4>
            <p style="font-size: 0.9em;">フリーランスと比較して手取りに差があるように見えますが、正社員なら<b>「有給休暇（入社初日付与）」</b>や<b>「厚生年金」</b>という見えない資産が蓄積されます。
            ランクを上げることで、将来的に「控除なし」の自由な働き方へ移行可能です。</p>
        `;
    }
    msgBox.innerHTML = msg;
}
</script>
